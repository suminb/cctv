
# k8s-deployment.yaml

# 1. Persistent Volume Claim
# This requests storage from your Kubernetes cluster for the video archive.
# Your cluster must have a StorageClass or a pre-provisioned PersistentVolume available.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cctv-archive-pvc
  namespace: cctv
spec:
  accessModes:
    - ReadWriteOnce # This volume can be mounted as read-write by a single node
  resources:
    requests:
      storage: 500Gi # IMPORTANT: Adjust storage size based on your needs
---
# 2. Deployment
# This defines how to run the CCTV archiver pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cctv-archiver
  namespace: cctv
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Recreate (not RollingUpdate): the archive PVC is ReadWriteOnce, so a new
  # pod on another node can never start while the old pod still holds the
  # volume. RollingUpdate deadlocks (new ContainerCreating forever, old never
  # terminates). Recreate stops the old pod first (brief recording gap).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cctv-archiver
  template:
    metadata:
      labels:
        app: cctv-archiver
    spec:
      # IMPORTANT: Give the pod enough time for the Python script to gracefully
      # shut down the ffmpeg process upon pod deletion/update.
      terminationGracePeriodSeconds: 45
      containers:
        - name: archiver
          # IMPORTANT: Replace this with the actual path to your built image.
          # Prefer unique per-release tags (e.g. :<git-short-sha>): Kubernetes
          # will NOT restart a pod when an existing tag is re-pushed with new
          # content, so deploying by a mutable tag silently keeps the old code.
          image: zot.whiterabbit.co.kr/app/cctv:latest
          imagePullPolicy: Always
          # --- Environment Variables ---
          env:
            # IMPORTANT: You MUST set the RTSP URL for your camera here.
            - name: RTSP_URL
              valueFrom:
                secretKeyRef:
                  name: cctv-rtsp-secret
                  key: RTSP_URL
            # This path must match the volume mount path below
            - name: ARCHIVE_PATH
              value: "/archive"
            # Optional: Set the retention period for video files
            - name: RETENTION_DAYS
              value: "90"
            - name: CCTV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cctv-rtsp-secret
                  key: CCTV_TOKEN
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # --- Volume Mounting ---
          volumeMounts:
            - name: archive-storage
              mountPath: /archive
      volumes:
        - name: archive-storage
          persistentVolumeClaim:
            claimName: cctv-archive-pvc
      imagePullSecrets:
        - name: zot-registry-secret
